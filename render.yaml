services:
  - type: web
    name: flashnova-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --worker-class simple_websocket.SimpleWebSocketServer -w 1 run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
